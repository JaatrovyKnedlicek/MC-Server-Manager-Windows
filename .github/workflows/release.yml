name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Build Self-Contained
      run: |
        dotnet publish "MC Server Manager 3.csproj" `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output ./publish/self-contained
    
    - name: Build Framework-Dependent
      run: |
        dotnet publish "MC Server Manager 3.csproj" `
          --configuration Release `
          --runtime win-x64 `
          --self-contained false `
          --output ./publish/framework-dependent
    
    - name: Create Self-Contained ZIP
      run: |
        Compress-Archive -Path ./publish/self-contained/* -DestinationPath ./MC-Server-Manager-self-contained-win-x64.zip
    
    - name: Create Framework-Dependent ZIP
      run: |
        Compress-Archive -Path ./publish/framework-dependent/* -DestinationPath ./MC-Server-Manager-framework-dependent-win-x64.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./MC-Server-Manager-self-contained-win-x64.zip
          ./MC-Server-Manager-framework-dependent-win-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
